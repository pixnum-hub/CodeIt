<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CodeIt — Run Code Anywhere</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e2128">
<link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeIt">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js"></script>
<style>
:root{
  --bg:#1e2128; --panel:#262933; --panel2:#2c2f3a; --fg:#e8e9ee; --muted:#8b8fa3;
  --border:#3a3e4c; --accent:#5eead4; --accent2:#f472b6; --err:#f87171; --ok:#4ade80;
  --font-ui:'Segoe UI',system-ui,sans-serif; --font-code:'Consolas','SF Mono',Menlo,monospace;
  --code-size:14px;
}
[data-theme="light"]{
  --bg:#f4f5f8; --panel:#ffffff; --panel2:#eceef3; --fg:#1c1e26; --muted:#5b5f70;
  --border:#d7dae2; --accent:#0d9488; --accent2:#be185d;
}
[data-theme="oled"]{
  --bg:#000000; --panel:#0a0a0a; --panel2:#121212; --fg:#e8e9ee; --muted:#7a7d8a;
  --border:#242424; --accent:#00e5c7; --accent2:#ff5fa2;
}
[data-theme="hc"]{
  --bg:#000000; --panel:#000000; --panel2:#111111; --fg:#ffffff; --muted:#ffd400;
  --border:#ffffff; --accent:#ffd400; --accent2:#00ffea;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-ui);
  display:flex; flex-direction:column; min-height:100vh;
  transition:background .2s,color .2s;
}
header{
  display:flex; align-items:center; justify-content:space-between;
  padding:.7rem .9rem; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:5;
}
.logo{font-weight:700; font-size:1.05rem; letter-spacing:.3px;}
.logo span{color:var(--accent);}
#themeBtn{
  background:var(--panel2); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:.45rem .7rem; font-size:.8rem; cursor:pointer; font-weight:600;
}
.controls{
  display:flex; gap:.5rem; padding:.6rem .9rem; background:var(--panel);
  border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center;
}
select, button.run{
  font-family:var(--font-ui); font-size:.85rem; border-radius:8px; border:1px solid var(--border);
  padding:.5rem .6rem; background:var(--panel2); color:var(--fg);
}
button.run{
  background:var(--accent); color:#0a0a0a; font-weight:700; border:none; cursor:pointer; flex:1;
  min-width:100px;
}
button.run:active{transform:scale(.97);}
button.run:disabled{opacity:.6;}
button.reset{
  font-family:var(--font-ui); font-size:.85rem; border-radius:8px; border:1px solid var(--border);
  padding:.5rem .7rem; background:var(--panel2); color:var(--fg); font-weight:600; cursor:pointer;
}
button.reset:active{transform:scale(.97);}
main{flex:1; display:flex; flex-direction:column; min-height:0;}
.pane{flex:1 1 0; display:flex; flex-direction:column; min-height:120px; border-bottom:1px solid var(--border); overflow:hidden;}
.resizer{
  flex:0 0 auto; height:20px; background:var(--panel2); border-bottom:1px solid var(--border);
  cursor:row-resize; touch-action:none; -webkit-user-select:none; user-select:none; position:relative;
}
.resizer::after{
  content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:36px; height:4px; border-radius:2px; background:var(--border);
}
.pane-head{
  display:flex; align-items:center; justify-content:space-between; gap:.4rem; flex-wrap:wrap;
  font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  padding:.4rem .6rem .4rem .8rem; background:var(--panel2);
}
.ed-tools{display:flex; gap:.3rem;}
.ed-tools button{
  background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:6px;
  font-size:.75rem; padding:.22rem .45rem; cursor:pointer; line-height:1.2;
}
.ed-tools button:active{transform:scale(.92);}
.editor-wrap{flex:1; display:flex; overflow:hidden; background:var(--panel); min-height:0; position:relative;}
#editorHost{flex:1; min-width:0; overflow:hidden;}
.CodeMirror{height:100%; font-family:var(--font-code); font-size:var(--code-size); background:var(--panel); color:var(--fg);}
.CodeMirror-gutters{background:var(--panel); border-right:1px solid var(--border);}
.CodeMirror-linenumber{color:var(--muted);}
.CodeMirror-cursor{border-left:1.5px solid var(--fg);}
.CodeMirror-selected{background:rgba(94,234,212,.25) !important;}
.CodeMirror-activeline-background{background:var(--panel2);}
.CodeMirror-matchingbracket{color:var(--accent) !important; font-weight:700;}
.CodeMirror-dialog{background:var(--panel2); color:var(--fg); border-bottom:1px solid var(--border);}
.CodeMirror-dialog input{background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:.2rem .4rem;}
.CodeMirror-hints{background:var(--panel2); color:var(--fg); border:1px solid var(--border); font-family:var(--font-code); font-size:.8rem; box-shadow:0 4px 12px rgba(0,0,0,.3);}
.CodeMirror-hint{padding:.2rem .5rem;}
li.CodeMirror-hint-active{background:var(--accent); color:#0a0a0a;}
.CodeMirror-lint-marker-warning{color:#facc15;}
.CodeMirror-lint-marker-error{color:var(--err);}
.CodeMirror-lint-tooltip{background:var(--panel2); color:var(--fg); border:1px solid var(--border); font-family:var(--font-ui); font-size:.75rem; padding:.3rem .5rem; border-radius:6px;}
.CodeMirror-foldgutter{width:.9em; color:var(--muted);}
.CodeMirror-foldgutter-open,.CodeMirror-foldgutter-folded{color:var(--muted); cursor:pointer;}
.error-line{background:rgba(248,113,113,.18) !important;}
#minimap{
  display:none; width:70px; flex:0 0 70px; overflow:hidden; border-left:1px solid var(--border);
  position:relative; cursor:pointer; background:var(--panel);
}
#minimap .CodeMirror{font-size:2.2px; line-height:1.4; pointer-events:none; height:100%;}
#minimapMount{height:100%;}
#minimapViewport{
  position:absolute; left:0; right:0; background:rgba(94,234,212,.15); border:1px solid var(--accent); pointer-events:none;
}
@media(min-width:800px){ #minimap{display:block;} }
.snippet-menu{position:relative;}
.snippet-list{
  display:none; position:absolute; right:0; top:110%; background:var(--panel2); border:1px solid var(--border);
  border-radius:8px; min-width:150px; z-index:10; overflow:hidden;
}
.snippet-list.open{display:block;}
.snippet-list button{
  display:block; width:100%; text-align:left; background:none; border:none; color:var(--fg);
  padding:.4rem .6rem; font-size:.75rem; cursor:pointer;
}
.snippet-list button:hover{background:var(--panel);}
#sidebarToggle{
  background:var(--panel2); color:var(--fg); border:1px solid var(--border);
  border-radius:8px; padding:.45rem .6rem; font-size:.9rem; cursor:pointer;
}
.sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:20;}
.sidebar-overlay.open{display:block;}
.sidebar{
  position:fixed; top:0; left:-280px; width:260px; height:100%; background:var(--panel2);
  border-right:1px solid var(--border); z-index:21; transition:left .2s ease; display:flex; flex-direction:column;
}
.sidebar.open{left:0;}
.sidebar-head{display:flex; justify-content:space-between; align-items:center; padding:.7rem; border-bottom:1px solid var(--border); font-weight:700;}
.sidebar-head button{background:none; border:none; color:var(--fg); font-size:1rem; cursor:pointer;}
.sidebar-section{padding:.6rem .7rem; border-bottom:1px solid var(--border);}
.sidebar-label{font-size:.7rem; text-transform:uppercase; color:var(--muted); margin-bottom:.4rem; letter-spacing:.06em;}
.sidebar-btn{
  width:100%; background:var(--accent); color:#0a0a0a; border:none; border-radius:6px;
  padding:.5rem; font-weight:700; cursor:pointer; font-size:.82rem;
}
.template-list{display:flex; flex-direction:column; gap:.3rem;}
.template-list button{
  text-align:left; background:var(--panel); border:1px solid var(--border); color:var(--fg);
  border-radius:6px; padding:.4rem .5rem; font-size:.78rem; cursor:pointer;
}
.template-list button:hover{background:var(--bg);}
.file-tree{display:flex; flex-direction:column; gap:.2rem;}
.file-item{
  display:flex; align-items:center; justify-content:space-between; padding:.4rem .5rem;
  border-radius:6px; cursor:pointer; font-size:.8rem;
}
.file-item:hover{background:var(--panel);}
.file-item.active{background:var(--accent); color:#0a0a0a;}
.file-item .file-actions{display:flex; gap:.25rem;}
.file-item .file-actions button{background:none; border:none; color:inherit; cursor:pointer; font-size:.75rem; padding:0 .2rem;}
.tab-bar{display:flex; align-items:center; overflow-x:auto; background:var(--panel2); border-bottom:1px solid var(--border);}
.tab{
  display:flex; align-items:center; gap:.35rem; padding:.4rem .6rem; font-size:.78rem; cursor:pointer;
  border-right:1px solid var(--border); white-space:nowrap; color:var(--muted); flex:0 0 auto;
}
.tab.active{background:var(--panel); color:var(--fg);}
.tab-close{background:none; border:none; color:inherit; cursor:pointer; font-size:.7rem; padding:0;}
.tab-add{background:none; border:none; color:var(--muted); font-size:1rem; cursor:pointer; padding:.3rem .6rem; flex:0 0 auto;}
.modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30;}
.modal-overlay.open{display:block;}
.modal{
  display:none; position:fixed; top:8%; left:50%; transform:translateX(-50%); width:min(560px,92vw);
  max-height:80vh; background:var(--panel2); border:1px solid var(--border); border-radius:10px;
  z-index:31; flex-direction:column; overflow:hidden;
}
.modal.open{display:flex;}
.modal-head{display:flex; justify-content:space-between; padding:.7rem; border-bottom:1px solid var(--border); font-weight:700; font-size:.85rem;}
.modal-head button{background:none; border:none; color:var(--fg); font-size:1rem; cursor:pointer;}
.history-list{overflow-y:auto; max-height:150px; border-bottom:1px solid var(--border);}
.history-item{display:flex; justify-content:space-between; align-items:center; padding:.5rem .7rem; font-size:.78rem; border-bottom:1px solid var(--border);}
.history-item button{background:var(--panel); border:1px solid var(--border); color:var(--fg); border-radius:5px; padding:.2rem .5rem; font-size:.72rem; cursor:pointer; margin-left:.3rem;}
.diff-view{padding:.6rem .7rem; overflow:auto; font-family:var(--font-code); font-size:.78rem; white-space:pre-wrap;}
.diff-add{background:rgba(74,222,128,.15); color:var(--ok); display:block;}
.diff-del{background:rgba(248,113,113,.15); color:var(--err); display:block; text-decoration:line-through;}
main.fs-editor #outputPane, main.fs-editor .resizer{display:none;}
main.fs-editor #editorPane{flex:1 1 100% !important;}
main.fs-output #editorPane, main.fs-output .resizer{display:none;}
main.fs-output #outputPane{flex:1 1 100% !important;}
.stdin-wrap{padding:.4rem .8rem 0;}
#stdin{
  width:100%; resize:vertical; background:var(--panel2); color:var(--fg); border:1px solid var(--border);
  border-radius:6px; font-family:var(--font-code); font-size:.78rem; padding:.4rem;
}
#output{
  flex:1; margin:0; padding:.8rem; overflow:auto; font-family:var(--font-code);
  font-size:.82rem; white-space:pre-wrap; background:var(--panel); color:var(--fg);
}
#output.err{color:var(--err);}
#output.ok{color:var(--fg);}
.meta{font-size:.72rem; color:var(--muted); padding:0 .8rem .3rem;}
footer{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; gap:.15rem; padding:.7rem; background:var(--panel);
  border-top:1px solid var(--border); font-size:.72rem; color:var(--muted);
}
footer strong{color:var(--fg);}
</style>
</head>
<body data-theme="dark">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head"><span>Files</span><button onclick="toggleSidebar(false)" title="Close">✕</button></div>
  <div class="sidebar-section">
    <button class="sidebar-btn" onclick="newBlankFile()">+ New File</button>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Templates</div>
    <div class="template-list" id="templateList"></div>
  </div>
  <div class="sidebar-section" style="flex:1; overflow:auto;">
    <div class="sidebar-label">Project Files</div>
    <div class="file-tree" id="fileTree"></div>
  </div>
</aside>

<div class="modal-overlay" id="historyOverlay" onclick="closeHistory()"></div>
<div class="modal" id="historyModal">
  <div class="modal-head"><span>Version History — <span id="historyFileName"></span></span><button onclick="closeHistory()">✕</button></div>
  <div class="history-list" id="historyList"></div>
  <div class="diff-view" id="diffView"></div>
</div>


<header>
  <div style="display:flex; align-items:center; gap:.5rem;">
    <button id="sidebarToggle" onclick="toggleSidebar()" title="Files">☰</button>
    <div class="logo">Code<span>It</span></div>
  </div>
  <button id="themeBtn" onclick="cycleTheme()">🌙 Dark</button>
</header>

<div class="controls">
  <select id="lang" aria-label="Language"></select>
  <button class="run" id="runBtn" onclick="runCode()">▶ Run Code</button>
  <button class="reset" id="resetBtn" onclick="resetAll()" title="Clear editor, output and saved code">🗑 Reset</button>
</div>

<main id="mainArea">
  <section class="pane" id="editorPane">
    <div class="pane-head">
      <span>Editor</span>
      <div class="ed-tools">
        <button onclick="editor.undo()" title="Undo">↶</button>
        <button onclick="editor.redo()" title="Redo">↷</button>
        <button onclick="editor.execCommand('find')" title="Find (Ctrl+F)">🔍</button>
        <button onclick="editor.execCommand('replace')" title="Replace (Ctrl+H)">⇄</button>
        <button onclick="showSuggestions()" title="Suggestions (Ctrl+Space)">💡</button>
        <button onclick="formatCode()" title="Format code">🪄</button>
        <button onclick="goToLine()" title="Go to line (Ctrl+G)">🎯</button>
        <button onclick="openHistory()" title="Version history">🕘</button>
        <div class="snippet-menu">
          <button onclick="toggleSnippetMenu()" title="Insert snippet">▤</button>
          <div class="snippet-list" id="snippetList"></div>
        </div>
        <button onclick="zoom(-1)" title="Smaller text">A-</button>
        <button onclick="zoom(1)" title="Larger text">A+</button>
        <button onclick="copyCode()" title="Copy code">📋</button>
        <button onclick="pasteCode()" title="Paste from clipboard">📥</button>
        <button onclick="downloadCode()" title="Download code">⬇</button>
        <button onclick="toggleFullscreen('editorPane')" title="Fullscreen">⛶</button>
      </div>
    </div>
    <div class="tab-bar" id="tabBar"></div>
    <div class="editor-wrap">
      <div id="editorHost"></div>
      <div id="minimap" title="Click to jump">
        <div id="minimapMount"></div>
        <div id="minimapViewport"></div>
      </div>
    </div>
  </section>
  <div class="resizer" id="resizer" title="Drag to resize · double-click to reset"></div>
  <section class="pane" id="outputPane">
    <div class="pane-head">
      <span>Output</span>
      <div class="ed-tools">
        <button onclick="copyOutput()" title="Copy output">📋</button>
        <button onclick="toggleFullscreen('outputPane')" title="Fullscreen">⛶</button>
      </div>
    </div>
    <div class="meta" id="meta"></div>
    <div class="stdin-wrap" id="stdinWrap">
      <textarea id="stdin" rows="2" placeholder="stdin input (optional, for interactive programs)"></textarea>
    </div>
    <pre id="output">Press "Run Code" to see output here.</pre>
    <iframe id="preview" style="display:none;border:none;width:100%;height:100%;background:#fff;"></iframe>
  </section>
</main>

<footer>
  <div>© <span id="year"></span> <strong>Manik Roy</strong>. All Rights Reserved.</div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Theme ----------
const themes = [
  {key:'dark', label:'🌙 Dark'},
  {key:'light', label:'☀️ Light'},
  {key:'oled', label:'⚫ OLED'},
  {key:'hc', label:'◐ High Contrast'}
];
let themeIdx = 0;
function cycleTheme(){
  themeIdx = (themeIdx + 1) % themes.length;
  applyTheme();
}
function applyTheme(){
  const t = themes[themeIdx];
  document.body.setAttribute('data-theme', t.key);
  document.getElementById('themeBtn').textContent = t.label;
}
applyTheme();

// ---------- Editor (CodeMirror): highlighting, brackets, active line, multi-cursor via Alt+Click ----------
const editor = CodeMirror(document.getElementById('editorHost'), {
  lineNumbers:true, matchBrackets:true, autoCloseBrackets:true, styleActiveLine:true,
  indentUnit:2, tabSize:2, mode:'text/html',
  viewportMargin:20, lineWrapping:false, undoDepth:1000,
  foldGutter:true, gutters:['CodeMirror-linenumbers','CodeMirror-foldgutter','CodeMirror-lint-markers'],
  lint:{getAnnotations: customLint, async:false},
  extraKeys:{
    'Ctrl-Enter': () => runCode(), 'Cmd-Enter': () => runCode(),
    'Ctrl-S': () => manualSave(), 'Cmd-S': () => manualSave(),
    'Ctrl-Space': () => showSuggestions(), 'Ctrl-G': () => goToLine(),
    'Shift-Ctrl-F': () => formatCode(), 'Shift-Cmd-F': () => formatCode()
  }
});
let fontSize = 14;
let minimapEditor;
initMinimap();
function refreshAll(){
  editor.refresh();
  if(minimapEditor){ minimapEditor.refresh(); syncMinimapViewport(); }
}
function zoom(delta){
  fontSize = Math.min(24, Math.max(10, fontSize + delta));
  document.documentElement.style.setProperty('--code-size', fontSize + 'px');
  refreshAll();
}

// ---------- Lazy-loaded language modes ----------
const CM_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/';
const loaded = new Set();
function loadScript(src){
  return new Promise(res => {
    if(loaded.has(src)) return res();
    const s = document.createElement('script');
    s.src = CM_BASE + src;
    s.onload = () => { loaded.add(src); res(); };
    s.onerror = res;
    document.head.appendChild(s);
  });
}
const modeInfo = {
  html:{mime:'text/html', deps:['mode/xml/xml.js','mode/javascript/javascript.js','mode/css/css.js','mode/htmlmixed/htmlmixed.js']},
  javascript:{mime:'text/javascript', deps:['mode/javascript/javascript.js']},
  typescript:{mime:'text/typescript', deps:['mode/javascript/javascript.js']},
  python:{mime:'text/x-python', deps:['mode/python/python.js']},
  java:{mime:'text/x-java', deps:['mode/clike/clike.js']},
  c:{mime:'text/x-csrc', deps:['mode/clike/clike.js']},
  cpp:{mime:'text/x-c++src', deps:['mode/clike/clike.js']},
  csharp:{mime:'text/x-csharp', deps:['mode/clike/clike.js']},
  go:{mime:'text/x-go', deps:['mode/go/go.js']},
  rust:{mime:'text/x-rustsrc', deps:['mode/rust/rust.js']},
  ruby:{mime:'text/x-ruby', deps:['mode/ruby/ruby.js']},
  php:{mime:'text/x-php', deps:['mode/clike/clike.js','mode/xml/xml.js','mode/javascript/javascript.js','mode/css/css.js','mode/htmlmixed/htmlmixed.js','mode/php/php.js']},
  swift:{mime:'text/x-swift', deps:['mode/swift/swift.js']},

  const wasActive = project.activeId === id;
  project.files = project.files.filter(f => f.id !== id);
  try{ window.storage.delete('history:' + id); }catch(e){}
  if(wasActive) switchFile(project.files[0].id);

  }else{

function diffLines(a, b){
  const A = a.split('\n'), B = b.split('\n');
  const n = A.length, m = B.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j] = A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0; const out=[];
  while(i<n && j<m){
    if(A[i]===B[j]){ out.push({t:'same', text:A[i]}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ out.push({t:'del', text:A[i]}); i++; }
    else{ out.push({t:'add', text:B[j]}); j++; }
  }
  while(i<n){ out.push({t:'del', text:A[i]}); i++; }
  while(j<m){ out.push({t:'add', text:B[j]}); j++; }
  return out;
}
function renderDiff(oldContent){
  const current = editor.getValue();
  const rows = diffLines(oldContent, current);
  const el = document.getElementById('diffView');
  if(rows.length > 3000){ el.textContent = 'File too large to diff inline. Use Restore to load this version instead.'; return; }
  el.innerHTML = rows.map(r => {
    const cls = r.t === 'add' ? 'diff-add' : r.t === 'del' ? 'diff-del' : '';
    const prefix = r.t === 'add' ? '+ ' : r.t === 'del' ? '- ' : '  ';
    const esc = (r.text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<span class="' + cls + '">' + prefix + esc + '</span>';
  }).join('\n');
}

// ---------- Lightweight generic linter (heuristic, language-agnostic) ----------
function customLint(text){
  const found = [];
  // Large paste guard: skip the expensive per-line/per-char scan for very
  // large documents so pasting a big file can't stall the main thread.
  if(text.length > 50000){
    return [{message:'File is large — detailed linting paused above 50,000 characters', severity:'info', from:CodeMirror.Pos(0,0), to:CodeMirror.Pos(0,0)}];
  }
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    const ws = line.match(/[ \t]+$/);
    if(ws) found.push({message:'Trailing whitespace', severity:'warning', from:CodeMirror.Pos(i, line.length - ws[0].length), to:CodeMirror.Pos(i, line.length)});
    if(line.length > 120) found.push({message:'Line exceeds 120 characters', severity:'warning', from:CodeMirror.Pos(i, 120), to:CodeMirror.Pos(i, line.length)});
    const todo = line.match(/\b(TODO|FIXME)\b/);
    if(todo) found.push({message: todo[1] + ' marker', severity:'info', from:CodeMirror.Pos(i, todo.index), to:CodeMirror.Pos(i, todo.index + todo[1].length)});
  });
  const pairs = {')':'(', ']':'[', '}':'{'};
  const opens = new Set(['(', '[', '{']);
  const stack = [];
  let line = 0, ch = 0;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(c === '\n'){ line++; ch = 0; continue; }
    if(opens.has(c)) stack.push({c, line, ch});
    else if(pairs[c]){
      if(stack.length && stack[stack.length-1].c === pairs[c]) stack.pop();
      else found.push({message:'Unmatched "' + c + '"', severity:'error', from:CodeMirror.Pos(line, ch), to:CodeMirror.Pos(line, ch+1)});
    }
    ch++;
  }
  stack.forEach(s => found.push({message:'Unmatched "' + s.c + '"', severity:'error', from:CodeMirror.Pos(s.line, s.ch), to:CodeMirror.Pos(s.line, s.ch+1)}));
  return found;
}

const beautifyLoaded = {};
function ensureBeautify(kind){
  if(beautifyLoaded[kind]) return Promise.resolve();
  const url = kind === 'js'
    ? 'https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify.min.js'
    : 'https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.15.1/beautify-html.min.js';
  return new Promise(res => {

    s.src = url;
    s.onload = () => { beautifyLoaded[kind] = true; res(); };
    s.onerror = res;
    document.head.appendChild(s);
  });
}

function initMinimap(){
  minimapEditor = CodeMirror(document.getElementById('minimapMount'), {
    value:'', readOnly:true, lineNumbers:false, viewportMargin:60, cursorBlinkRate:-1
  });
  minimapEditor.swapDoc(editor.linkedDoc({sharedHist:false}));
  syncMinimapViewport();
  editor.on('scroll', syncMinimapViewport);
  editor.on('changes', () => setTimeout(syncMinimapViewport, 0));
  document.getElementById('minimap').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const frac = (e.clientY - rect.top) / rect.height;
    editor.scrollIntoView({line: Math.floor(frac * editor.lineCount()), ch:0}, 100);
  });
}
function syncMinimapViewport(){
  const mm = document.getElementById('minimap');
  if(!mm || mm.offsetParent === null) return;
  const info = editor.getScrollInfo();
  const scrollRange = Math.max(1, info.height - info.clientHeight);
  const frac = Math.min(1, Math.max(0, info.top / scrollRange));
  // Keep the (virtualized) minimap scrolled to roughly the same relative
  // position as the main editor, instead of rendering the whole document.
  const mmInfo = minimapEditor.getScrollInfo();
  const mmRange = Math.max(0, mmInfo.height - mmInfo.clientHeight);
  minimapEditor.scrollTo(null, frac * mmRange);
  const mmHeight = mm.clientHeight;
  const vp = document.getElementById('minimapViewport');
  vp.style.top = frac * (mmHeight - Math.max(6, (info.clientHeight / info.height) * mmHeight)) + 'px';
  vp.style.height = Math.max(6, (info.clientHeight / info.height) * mmHeight) + 'px';
}

function withTimeout(promise, ms){

  withTimeout(navigator.clipboard.readText(), 2500)
    .then(text => { editor.replaceSelection(text); flashMeta('✓ Pasted'); })
    .catch(() => flashMeta('⚠ Clipboard blocked here — open the file outside the preview'));
}
function copyOutput(){
  const text = document.getElementById('preview').style.display === 'block' ? editor.getValue() : document.getElementById('output').textContent;
  withTimeout(navigator.clipboard.writeText(text), 2500)
    .then(() => flashMeta('✓ Output copied'))
    .catch(() => flashMeta('⚠ Clipboard blocked here — open the file outside the preview'));
}
function downloadCode(){
  flushActiveFile();
  const f = getActiveFile();
  const blob = new Blob([f.content], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = f.name || ('file.' + (extMap[f.lang] || 'txt'));
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Fullscreen ----------
function toggleFullscreen(paneId){
  const cls = paneId === 'editorPane' ? 'fs-editor' : 'fs-output';
  mainArea.classList.contains(cls) ? mainArea.classList.remove(cls) : (mainArea.classList.remove('fs-editor','fs-output'), mainArea.classList.add(cls));
  refreshAll();
}
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if(mod && e.key === 'Enter'){ e.preventDefault(); runCode(); }
  else if(mod && e.key.toLowerCase() === 's'){ e.preventDefault(); manualSave(); }
  else if(e.key === 'Escape'){ mainArea.classList.remove('fs-editor','fs-output'); refreshAll(); }
});

// ---------- Run ----------
async function runCode(){
  flushActiveFile();
  const f = getActiveFile();
  const lang = f.lang;
  const outEl = document.getElementById('output');
  const previewEl = document.getElementById('preview');
  if(lang === 'html'){
    const cssFiles = project.files.filter(x => x.lang === 'css');
    const jsFiles = project.files.filter(x => x.lang === 'javascript');
    let html = f.content;
    if(cssFiles.length){
      const styleTag = '<style>\n' + cssFiles.map(x => x.content).join('\n') + '\n</style>';
      html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, styleTag + '\n</head>') : styleTag + '\n' + html;
    }
    if(jsFiles.length){
      const scriptTag = '<script>\n' + jsFiles.map(x => x.content).join('\n') + '\n<\/script>';
      html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, scriptTag + '\n</body>') : html + '\n' + scriptTag;
    }
    previewEl.srcdoc = html;
    previewEl.style.display = 'block';
    outEl.style.display = 'none';
    const bundled = [cssFiles.length ? cssFiles.length + ' CSS' : '', jsFiles.length ? jsFiles.length + ' JS' : ''].filter(Boolean).join(', ');
    document.getElementById('meta').textContent = 'Live preview' + (bundled ? ' · bundled ' + bundled : '');
    return;
  }
  if(lang === 'css'){
    setOutput('CSS files run automatically when you execute their linked HTML file. Switch to an HTML file and hit Run.', false);
    return;
  }
  previewEl.style.display = 'none';
  outEl.style.display = 'block';
  const version = runtimeMap[lang];
  if(!lang || !version){ setOutput('Language not ready yet, try again in a moment.', true); return; }
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = '⏳ Running...';
  setOutput('Running...', false);
  clearErrorHighlight();
  const started = performance.now();
  const siblingFiles = project.files.filter(x => x.lang === lang && x.id !== f.id).map(x => ({name: x.name, content: x.content}));
  try{
    const res = await fetch('https://emkc.org/api/v2/piston/execute', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        language: lang,
        version: version,
        files: [{ name: f.name, content: f.content }, ...siblingFiles],
        stdin: document.getElementById('stdin').value
      })
    });
    const data = await res.json();
    const ms = Math.round(performance.now() - started);
    const run = data.run || {};
    const compile = data.compile || {};
    let text = '';
    if(compile.stderr) text += '[compile error]\n' + compile.stderr + '\n';
    text += (run.stdout || '');
    if(run.stderr) text += (text ? '\n' : '') + '[stderr]\n' + run.stderr;
    if(!text.trim()) text = '(no output)';
    document.getElementById('meta').textContent = lang + ' ' + version + ' · ' + ms + 'ms · exit code ' + (run.code ?? '0') + (siblingFiles.length ? ' · +' + siblingFiles.length + ' file(s)' : '');
    setOutput(text, !!(run.stderr || compile.stderr));
    if(compile.stderr) highlightError(compile.stderr);
    else if(run.stderr) highlightError(run.stderr);
  }catch(err){
    setOutput('Network error: ' + err.message, true);
  }finally{
    btn.disabled = false; btn.textContent = '▶ Run Code';
  }
}
function setOutput(text, isErr){
  const out = document.getElementById('output');
  out.textContent = text;
  out.className = isErr ? 'err' : 'ok';
}

// ---------- Reset ----------
async function resetAll(){
  const f = getActiveFile();
  if(!confirm('Clear "' + f.name + '" and its saved version history? Other files in this project are not affected.')) return;
  clearTimeout(saveTimer);
  editor.setValue('');
  editor.clearHistory();
  clearErrorHighlight();
  document.getElementById('stdin').value = '';
  const previewEl = document.getElementById('preview');
  previewEl.srcdoc = '';
  previewEl.style.display = 'none';
  document.getElementById('output').style.display = 'block';
  setOutput('Press "Run Code" to see output here.', false);
  document.getElementById('meta').textContent = '';
  f.content = '';
  await saveProject();
  try{ await window.storage.delete('history:' + f.id); }catch(e){}
  flashMeta('✓ Reset');
}

initApp();

// ---------- PWA ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {scope: './'}).catch(() => {});
  });
}

// ---------- Resizable panes ----------
const mainArea = document.getElementById('mainArea');
const editorPane = document.getElementById('editorPane');
const outputPane = document.getElementById('outputPane');
const resizer = document.getElementById('resizer');
function isRow(){ return false; }
function setSplit(pct){
  pct = Math.min(80, Math.max(20, pct));
  editorPane.style.flex = '0 0 ' + pct + '%';
  outputPane.style.flex = '1 1 auto';
}
resizer.addEventListener('mousedown', e => { e.preventDefault(); beginDrag(); });
resizer.addEventListener('touchstart', e => { e.preventDefault(); beginDrag(); }, {passive:false});
function beginDrag(){
  function onMove(ev){
    ev.preventDefault();
    const pt = ev.touches ? ev.touches[0] : ev;
    const rect = mainArea.getBoundingClientRect();
    const pct = isRow()
      ? ((pt.clientX - rect.left) / rect.width) * 100
      : ((pt.clientY - rect.top) / rect.height) * 100;
    setSplit(pct);
    refreshAll();
  }
  function onEnd(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchend', onEnd);
    document.removeEventListener('touchcancel', onEnd);
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
  document.addEventListener('touchcancel', onEnd);
}
resizer.addEventListener('dblclick', () => {
  editorPane.style.flex = '';
  outputPane.style.flex = '';
  refreshAll();
});
window.addEventListener('resize', () => refreshAll());
</script>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
<title>CodeIt — Online IDE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CodeIt">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{ --fontsize:13px; }
  :root{
    --dark-bg:#1e1e1e;--dark-panel:#252526;--dark-text:#d4d4d4;--dark-muted:#8a8a8a;--dark-accent:#3794ff;--dark-border:#3c3c3c;--dark-btn:#0e639c;--dark-btnText:#fff;
    --dark-kw:#569cd6;--dark-str:#ce9178;--dark-com:#6a9955;--dark-num:#b5cea8;
    --light-bg:#ffffff;--light-panel:#f3f3f3;--light-text:#1e1e1e;--light-muted:#6e6e6e;--light-accent:#005fb8;--light-border:#e2e2e2;--light-btn:#005fb8;--light-btnText:#fff;
    --light-kw:#0000ff;--light-str:#a31515;--light-com:#008000;--light-num:#098658;
    --oled-bg:#000000;--oled-panel:#050505;--oled-text:#e8e8e8;--oled-muted:#7a7a7a;--oled-accent:#00e5c7;--oled-border:#1c1c1c;--oled-btn:#00e5c7;--oled-btnText:#000;
    --oled-kw:#7ee787;--oled-str:#ffab70;--oled-com:#8b949e;--oled-num:#79c0ff;
    --hc-bg:#000000;--hc-panel:#000000;--hc-text:#ffffff;--hc-muted:#ffff00;--hc-accent:#ffff00;--hc-border:#ffffff;--hc-btn:#ffff00;--hc-btnText:#000000;
    --hc-kw:#ffff00;--hc-str:#00ffff;--hc-com:#00ff00;--hc-num:#ff77ff;
  }
  [data-theme="dark"]{--bg:var(--dark-bg);--panel:var(--dark-panel);--text:var(--dark-text);--muted:var(--dark-muted);--accent:var(--dark-accent);--border:var(--dark-border);--btn:var(--dark-btn);--btnText:var(--dark-btnText);--tok-kw:var(--dark-kw);--tok-str:var(--dark-str);--tok-com:var(--dark-com);--tok-num:var(--dark-num);}
  [data-theme="light"]{--bg:var(--light-bg);--panel:var(--light-panel);--text:var(--light-text);--muted:var(--light-muted);--accent:var(--light-accent);--border:var(--light-border);--btn:var(--light-btn);--btnText:var(--light-btnText);--tok-kw:var(--light-kw);--tok-str:var(--light-str);--tok-com:var(--light-com);--tok-num:var(--light-num);}
  [data-theme="oled"]{--bg:var(--oled-bg);--panel:var(--oled-panel);--text:var(--oled-text);--muted:var(--oled-muted);--accent:var(--oled-accent);--border:var(--oled-border);--btn:var(--oled-btn);--btnText:var(--oled-btnText);--tok-kw:var(--oled-kw);--tok-str:var(--oled-str);--tok-com:var(--oled-com);--tok-num:var(--oled-num);}
  [data-theme="hc"]{--bg:var(--hc-bg);--panel:var(--hc-panel);--text:var(--hc-text);--muted:var(--hc-muted);--accent:var(--hc-accent);--border:var(--hc-border);--btn:var(--hc-btn);--btnText:var(--hc-btnText);--tok-kw:var(--hc-kw);--tok-str:var(--hc-str);--tok-com:var(--hc-com);--tok-num:var(--hc-num);}

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;height:100vh;height:100dvh;
    transition:background .2s,color .2s;
  }
  header{
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    padding:.6rem .8rem;border-bottom:1px solid var(--border);
    background:var(--panel);position:sticky;top:0;z-index:5;
  }
  .brand{display:flex;align-items:center;gap:.4rem;font-weight:700;font-size:1.05rem;margin-right:auto;}
  select,button{
    font:inherit;border-radius:6px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);padding:.35rem .55rem;cursor:pointer;font-size:.85rem;
  }
  #runBtn{background:var(--btn);color:var(--btnText);border-color:var(--btn);font-weight:700;display:flex;align-items:center;gap:.35rem;}
  #installBtn{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700;}
  .ios-hint{
    position:fixed;left:.6rem;right:.6rem;bottom:.6rem;z-index:30;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:.6rem .8rem;border-radius:10px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.35);
    display:flex;align-items:center;gap:.6rem;
  }
  .ios-hint button{flex:none;padding:.1rem .5rem;}
  #runBtn:disabled{opacity:.6;cursor:wait;}
  .ghost{color:var(--muted);}
  .ghost:hover{color:var(--text);border-color:var(--text);}
  .ghost.active{color:var(--accent);border-color:var(--accent);}
  .themes{display:flex;gap:.3rem;border-left:1px solid var(--border);padding-left:.5rem;}
  .themes button{width:2rem;padding:.35rem 0;font-size:.72rem;}
  .themes button.active{outline:2px solid var(--accent);}
  .net-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;}
  .net-dot.ok{background:#3fb950;}
  .net-dot.bad{background:#e5534b;}

  .tabbar{
    display:flex;align-items:center;gap:2px;overflow-x:auto;background:var(--panel);
    border-bottom:1px solid var(--border);padding:.25rem .4rem;flex:none;
  }
  .tab{
    display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;border-radius:6px 6px 0 0;
    background:var(--bg);color:var(--muted);font-size:.78rem;white-space:nowrap;cursor:pointer;flex:none;
    border:1px solid var(--border);border-bottom:none;
  }
  .tab.active{color:var(--text);background:var(--bg);border-color:var(--accent);}
  .tab-close{background:none;border:none;color:inherit;padding:0 .2rem;font-size:.85rem;border-radius:4px;cursor:pointer;}
  .tab-close:hover{background:var(--border);}
  .tab-add{flex:none;padding:.3rem .6rem;font-size:.9rem;}
  .tab-rename{font:inherit;font-size:.78rem;background:var(--bg);color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:1px 4px;width:100px;}

  main{
    flex:1;display:grid;overflow:hidden;background:var(--border);gap:1px;min-height:0;
    grid-template-columns:1fr;grid-template-rows:var(--a,1fr) 16px var(--b,1fr);
  }
  @media(min-width:860px){
    main{grid-template-columns:var(--a,1fr) 16px var(--b,1fr);grid-template-rows:1fr;}
  }

  .editor-wrap{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative;}
  .editor-main{flex:1;min-height:0;display:flex;overflow:hidden;}
  #gutter{
    padding:.8rem .5rem;text-align:right;color:var(--muted);
    background:var(--panel);user-select:none;overflow:hidden;
    font-family:Menlo,Consolas,"Courier New",monospace;font-size:var(--fontsize);line-height:1.55;white-space:pre;
  }
  .err-line{background:#e5534b;color:#fff;border-radius:3px;padding:0 3px;}
  .code-area{position:relative;flex:1;min-width:0;}
  #highlight,#code{
    position:absolute;inset:0;margin:0;padding:.8rem;border:0;
    font-family:Menlo,Consolas,"Courier New",monospace;font-size:var(--fontsize);line-height:1.55;tab-size:2;
    white-space:pre-wrap;overflow-wrap:break-word;
  }
  .editor-wrap.nowrap #highlight,.editor-wrap.nowrap #code{white-space:pre;overflow-x:auto;}
  #highlight{overflow:auto;pointer-events:none;color:var(--text);}
  #code{
    resize:none;outline:none;overflow:auto;background:transparent;color:transparent;caret-color:var(--text);
  }
  #code::placeholder{color:var(--muted);}
  .tok-kw{color:var(--tok-kw);font-weight:600;}
  .tok-str{color:var(--tok-str);}
  .tok-com{color:var(--tok-com);font-style:italic;}
  .tok-num{color:var(--tok-num);}
  .bracket-match{background:var(--accent);color:var(--bg);border-radius:2px;}

  .statusbar{
    flex:none;display:flex;gap:.8rem;align-items:center;padding:.2rem .7rem;
    font-size:.7rem;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);
  }
  .statusbar button{background:none;border:none;color:inherit;font:inherit;font-size:.7rem;padding:0;cursor:pointer;}
  .statusbar button:hover{color:var(--accent);}
  #vimMode{font-weight:700;color:var(--accent);}

  .symbolbar{
    flex:none;display:flex;gap:.3rem;overflow-x:auto;padding:.3rem .5rem;
    background:var(--panel);border-top:1px solid var(--border);
  }
  .symbolbar.hidden{display:none;}
  .symbolbar button{
    flex:none;padding:.25rem .55rem;font:13px Menlo,Consolas,monospace;
    background:var(--bg);color:var(--text);border:1px solid var(--border);
  }
  #regexToggle{flex:none;}
  .outline-item{
    text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:5px;
    padding:.3rem .5rem;font-size:.78rem;color:var(--text);cursor:pointer;
  }
  .outline-item:hover{border-color:var(--accent);}
  .outline-empty{color:var(--muted);font-size:.78rem;padding:.3rem;}

  .ac-menu{
    position:absolute;z-index:6;background:var(--panel);border:1px solid var(--border);
    border-radius:6px;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.35);min-width:120px;
  }
  .ac-item{padding:.35rem .6rem;font:12px Menlo,Consolas,monospace;color:var(--text);cursor:pointer;}
  .ac-item.sel,.ac-item:hover{background:var(--btn);color:var(--btnText);}

  .findbar{
    position:absolute;top:.5rem;right:.5rem;left:.5rem;z-index:4;
    display:flex;flex-wrap:wrap;gap:.3rem;padding:.4rem;border-radius:8px;
    background:var(--panel);border:1px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .findbar input{
    font:inherit;font-size:.85rem;border-radius:6px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);padding:.3rem .5rem;flex:1;min-width:80px;
  }
  #findCount{align-self:center;font-size:.75rem;color:var(--muted);white-space:nowrap;}

  .resizer{
    flex:none;background:var(--border);touch-action:none;position:relative;
    width:100%;height:16px;cursor:row-resize;
  }
  .resizer::before{
    content:'';position:absolute;background:var(--muted);border-radius:2px;
    top:50%;left:50%;width:36px;height:4px;transform:translate(-50%,-50%);
  }
  .resizer::after{ content:''; position:absolute; top:-8px; left:-8px; right:-8px; bottom:-8px; }
  @media(min-width:860px){
    .resizer{width:16px;height:auto;cursor:col-resize;}
    .resizer::before{width:4px;height:36px;}
  }

  main.preview-full{grid-template-columns:1fr!important;grid-template-rows:1fr!important;}
  main.preview-full .editor-wrap,main.preview-full .resizer{display:none;}
  #fullscreenBtn.active{color:var(--accent);border-color:var(--accent);}
  .output-panel{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
  .stdin-row{display:flex;align-items:center;gap:.4rem;padding:.35rem .8rem;background:var(--panel);border-bottom:1px solid var(--border);}
  .stdin-row label{font-size:.72rem;color:var(--muted);flex:none;}
  .stdin-row input{
    flex:1;font:12px Menlo,Consolas,monospace;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:5px;padding:.25rem .5rem;
  }
  .output-header{
    display:flex;justify-content:space-between;align-items:center;gap:.5rem;
    padding:.4rem .8rem;background:var(--panel);border-bottom:1px solid var(--border);
    font-size:.8rem;color:var(--muted);
  }
  .tabs{display:flex;gap:.3rem;}
  .tabs button{padding:.25rem .6rem;font-size:.75rem;background:transparent;}
  .tabs button.active{background:var(--btn);color:var(--btnText);border-color:var(--btn);}
  #status{color:var(--accent);}
  #output{
    flex:1;margin:0;padding:.8rem;overflow:auto;white-space:pre-wrap;
    font:13px/1.55 Menlo,Consolas,"Courier New",monospace;contain:content;
  }
  #preview{flex:1;border:0;width:100%;background:#fff;display:none;}
  .output-panel.show-preview #preview{display:block;}
  .output-panel.show-preview #output{display:none;}

  footer{
    border-top:1px solid var(--border);background:var(--panel);
    padding:.7rem 1rem;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;gap:.15rem;flex:none;
  }
  footer small{color:var(--muted);font-size:.78rem;}

  .toast{
    position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);z-index:20;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:.5rem .9rem;border-radius:8px;font-size:.8rem;box-shadow:0 4px 14px rgba(0,0,0,.35);
    display:flex;gap:.6rem;align-items:center;max-width:90vw;
  }
  .toast button{padding:.1rem .4rem;}
</style>
</head>
<body>

<header>
  <div class="brand">CodeIt</div>
  <button id="installBtn" hidden title="Install CodeIt as an app">⬇ Install</button>
  <select id="langSelect" aria-label="Language"></select>
  <button id="runBtn">▶ Run<span class="net-dot" id="netDot" title="Execution API status"></span></button>
  <button id="undoBtn" class="ghost" title="Undo">↶</button>
  <button id="redoBtn" class="ghost" title="Redo">↷</button>
  <button id="findBtn" class="ghost" title="Find & replace (Ctrl+F)">🔍</button>
  <button id="commentBtn" class="ghost" title="Toggle comment (Ctrl+/)">💬</button>
  <button id="wrapBtn" class="ghost" title="Toggle word wrap">↔</button>
  <button id="formatBtn" class="ghost" title="Auto-format / re-indent">✨</button>
  <button id="outlineBtn" class="ghost" title="Symbol outline">☰</button>
  <button id="columnBtn" class="ghost" title="Column edit mode: select multiple lines, then type">▤</button>
  <button id="vimBtn" class="ghost" title="Toggle Vim keybindings">Vim</button>
  <button id="symbolsBtn" class="ghost active" title="Toggle quick-symbol toolbar">⌨</button>
  <button id="copyBtn" class="ghost" title="Copy code">⧉</button>
  <button id="importBtn" class="ghost" title="Import file">📥</button>
  <button id="exportBtn" class="ghost" title="Download file">📤</button>
  <input type="file" id="importInput" hidden>
  <button id="exportAllBtn" class="ghost" title="Backup all tabs as JSON">💾</button>
  <button id="importAllBtn" class="ghost" title="Restore tabs from a backup">📦</button>
  <input type="file" id="importAllInput" accept=".json" hidden>
  <button id="zoomOut" class="ghost" title="Smaller text">A−</button>
  <button id="zoomIn" class="ghost" title="Larger text">A+</button>
  <button id="resetBtn" class="ghost" title="Clear current file">⟲ Reset</button>
  <button id="blankBtn" class="ghost" title="New blank HTML file">📄 Blank</button>
  <div class="themes" id="themes" aria-label="Theme toggle">
    <button data-t="dark" title="Dark+">D+</button>
    <button data-t="light" title="Light+">L+</button>
    <button data-t="oled" title="OLED True Black">OL</button>
    <button data-t="hc" title="High Contrast">HC</button>
    <button data-t="auto" title="Match device theme">🌓</button>
  </div>
</header>

<div class="tabbar" id="tabBar"></div>

<main>
  <div class="editor-wrap" id="editorWrap">
    <div class="editor-main">
      <div id="gutter">1</div>
      <div class="code-area">
        <pre id="highlight" aria-hidden="true"><code id="hlCode"></code></pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
          placeholder="Write your code here..."></textarea>
        <div class="ac-menu" id="acMenu" hidden></div>
      </div>
    </div>
    <div class="statusbar">
      <button id="statusPos" title="Go to line (Ctrl+G)">Ln 1, Col 1</button>
      <span id="statusCount">0 chars · 0 words</span>
      <span id="vimMode" hidden>NORMAL</span>
    </div>
    <div class="findbar" id="findBar" hidden>
      <input id="findInput" type="text" placeholder="Find">
      <button id="regexToggle" class="ghost" title="Use regular expression">.*</button>
      <span id="findCount">0/0</span>
      <button id="findPrev" class="ghost" title="Previous">↑</button>
      <button id="findNext" class="ghost" title="Next">↓</button>
      <input id="replaceInput" type="text" placeholder="Replace">
      <button id="replaceOne" class="ghost">Replace</button>
      <button id="replaceAll" class="ghost">All</button>
      <button id="findClose" class="ghost" title="Close">✕</button>
    </div>
    <div class="findbar" id="gotoBar" hidden>
      <input id="gotoInput" type="number" min="1" placeholder="Line number">
      <button id="gotoGo" class="ghost">Go</button>
      <button id="gotoClose" class="ghost" title="Close">✕</button>
    </div>
    <div class="findbar" id="outlineBar" hidden>
      <div id="outlineList" style="display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;width:100%;"></div>
      <button id="outlineClose" class="ghost" title="Close">✕</button>
    </div>
    <div class="symbolbar" id="symbolBar"></div>
  </div>
  <div class="resizer" id="resizer" title="Drag to resize"></div>
  <div class="output-panel" id="outputPanel">
    <div class="stdin-row">
      <label for="stdinInput">⌨ stdin</label>
      <input id="stdinInput" type="text" placeholder="Input your program reads (optional)">
    </div>
    <div class="output-header">
      <div class="tabs">
        <button id="tabPreview">Preview</button>
        <button id="tabConsole" class="active">Console</button>
      </div>
      <span id="status">idle</span>
      <button id="fullscreenBtn" class="ghost" title="Toggle fullscreen">⛶</button>
    </div>
    <pre id="output">Press ▶ Run to execute your code.</pre>
    <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-modals allow-forms allow-same-origin"></iframe>
  </div>
</main>

<footer>
  <small>© <span id="year"></span> Manik Roy. All Rights Reserved.</small>
</footer>

<script>
const API = "https://emkc.org/api/v2/piston";
const code = document.getElementById('code');
const gutter = document.getElementById('gutter');
const hl = document.getElementById('highlight');
const hlCode = document.getElementById('hlCode');
const langSelect = document.getElementById('langSelect');
const runBtn = document.getElementById('runBtn');
const netDot = document.getElementById('netDot');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const commentBtn = document.getElementById('commentBtn');
const wrapBtn = document.getElementById('wrapBtn');
const copyBtn = document.getElementById('copyBtn');
const importBtn = document.getElementById('importBtn');
const importInput = document.getElementById('importInput');
const exportBtn = document.getElementById('exportBtn');
const exportAllBtn = document.getElementById('exportAllBtn');
const importAllBtn = document.getElementById('importAllBtn');
const importAllInput = document.getElementById('importAllInput');
const zoomOut = document.getElementById('zoomOut');
const zoomIn = document.getElementById('zoomIn');
const resetBtn = document.getElementById('resetBtn');
const blankBtn = document.getElementById('blankBtn');
const output = document.getElementById('output');
const preview = document.getElementById('preview');
const outputPanel = document.getElementById('outputPanel');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const tabPreview = document.getElementById('tabPreview');
const tabConsole = document.getElementById('tabConsole');
const status = document.getElementById('status');
const stdinInput = document.getElementById('stdinInput');
const resizer = document.getElementById('resizer');
const mainEl = document.querySelector('main');
const tabBar = document.getElementById('tabBar');
const acMenu = document.getElementById('acMenu');
const editorWrap = document.getElementById('editorWrap');
const statusPos = document.getElementById('statusPos');
const statusCount = document.getElementById('statusCount');
const vimModeEl = document.getElementById('vimMode');
const formatBtn = document.getElementById('formatBtn');
const outlineBtn = document.getElementById('outlineBtn');
const outlineBar = document.getElementById('outlineBar');
const outlineList = document.getElementById('outlineList');
const outlineClose = document.getElementById('outlineClose');
const columnBtn = document.getElementById('columnBtn');
const vimBtn = document.getElementById('vimBtn');
const symbolsBtn = document.getElementById('symbolsBtn');
const symbolBar = document.getElementById('symbolBar');
const regexToggle = document.getElementById('regexToggle');
let runtimes = {};

// ---- output tab switching ----
function showTab(t){
  outputPanel.classList.toggle('show-preview', t === 'preview');
  tabPreview.classList.toggle('active', t === 'preview');
  tabConsole.classList.toggle('active', t === 'console');
}
tabPreview.addEventListener('click', () => showTab('preview'));
tabConsole.addEventListener('click', () => showTab('console'));

// ---- fullscreen preview/console panel ----
let isFull = false;
function setFullscreen(on){
  isFull = on;
  mainEl.classList.toggle('preview-full', isFull);
  fullscreenBtn.classList.toggle('active', isFull);
  fullscreenBtn.textContent = isFull ? '⤢' : '⛶';
  fullscreenBtn.title = isFull ? 'Exit fullscreen' : 'Toggle fullscreen';
}
fullscreenBtn.addEventListener('click', async () => {
  setFullscreen(!isFull);
  try{
    if(isFull && outputPanel.requestFullscreen) await outputPanel.requestFullscreen();
    else if(!isFull && document.fullscreenElement) await document.exitFullscreen();
  }catch(err){}
});
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && isFull) setFullscreen(false);
});

// ---- draggable split ----
function isRow(){ try{ return window.matchMedia('(min-width:860px)').matches; }catch(err){ return window.innerWidth >= 860; } }
function setSplit(pct){
  pct = Math.min(80, Math.max(20, pct));
  mainEl.style.setProperty('--a', pct + 'fr');
  mainEl.style.setProperty('--b', (100 - pct) + 'fr');
}
let dragging = false, pendingPct = null, resizeQueued = false;
function startDrag(e){
  dragging = true;
  document.body.style.userSelect = 'none';
  try{ resizer.setPointerCapture(e.pointerId); }catch(err){}
}
function endDrag(e){
  dragging = false;

  const isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);

// ---- syntax highlighting ----
const KEYWORDS = new Set(['function','return','if','else','elif','for','foreach','while','do','switch','case','default',
  'break','continue','class','struct','enum','interface','extends','implements','public','private','protected','static',
  'final','const','let','var','def','fn','fun','func','import','from','as','export','package','namespace','using',
  'include','require','new','delete','try','catch','finally','throw','throws','async','await','yield','lambda','with',
  'pass','self','this','super','void','int','float','double','long','short','byte','char','bool','boolean','string',
  'String','True','False','None','null','nil','undefined','true','false','and','or','not','in','is','print','echo',
  'puts','console','begin','end','then','module','mod','pub','mut','impl','trait','match','type','typedef','template']);
const HL_RE = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+\.?\d*\b)|([A-Za-z_$][\w$]*)/g;
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escSeg(text, startIdx, marks){
  if(!marks.length) return escapeHtml(text);
  let out = '';
  for(let i = 0; i < text.length; i++){
    const ch = escapeHtml(text[i]);
    out += marks.includes(startIdx + i) ? `<span class="bracket-match">${ch}</span>` : ch;
  }
  return out;
}
function highlightCode(src, marks){
  marks = marks || [];
  HL_RE.lastIndex = 0;
  let out = '', last = 0, m;
  while((m = HL_RE.exec(src))){
    out += escSeg(src.slice(last, m.index), last, marks);
    const [full, com, str, num, word] = m;
    const esc = escapeHtml(full);
    if(com) out += `<span class="tok-com">${esc}</span>`;
    else if(str) out += `<span class="tok-str">${esc}</span>`;
    else if(num) out += `<span class="tok-num">${esc}</span>`;
    else if(word && KEYWORDS.has(word)) out += `<span class="tok-kw">${esc}</span>`;
    else out += esc;
    last = HL_RE.lastIndex;
  }
  out += escSeg(src.slice(last), last, marks);
  return out + '\n';
}
function findMatchingBracket(v, pos){
  const open = '([{', close = ')]}';
  const ch = v[pos];
  if(open.includes(ch)){
    const pair = close[open.indexOf(ch)];
    let depth = 0;
    for(let i = pos; i < v.length; i++){
      if(v[i] === ch) depth++;
      else if(v[i] === pair){ depth--; if(depth === 0) return i; }
    }
  } else if(close.includes(ch)){
    const pair = open[close.indexOf(ch)];
    let depth = 0;
    for(let i = pos; i >= 0; i--){
      if(v[i] === ch) depth++;
      else if(v[i] === pair){ depth--; if(depth === 0) return i; }
    }
  }
  return -1;
}
function getBracketMarks(){
  const v = code.value, s = code.selectionStart;
  if(s !== code.selectionEnd) return [];
  const brackets = '()[]{}';
  let pos = -1;
  if(brackets.includes(v[s])) pos = s;
  else if(brackets.includes(v[s - 1])) pos = s - 1;
  if(pos < 0) return [];
  const m = findMatchingBracket(v, pos);
  return m < 0 ? [] : [pos, m];
}

// ---- gutter (with optional error-line marker) + highlight, throttled to one frame ----
let lastGutterKey = '', errorLineNum = null;
function updateGutter(){
  const n = code.value ? code.value.split('\n').length : 1;
  const key = n + ':' + errorLineNum;
  if(key === lastGutterKey) return;
  lastGutterKey = key;
  let html = '';
  for(let i = 1; i <= n; i++) html += (i === errorLineNum ? `<span class="err-line">${i}</span>` : i) + '\n';
  gutter.innerHTML = html;
}
function renderHighlight(){ hlCode.innerHTML = highlightCode(code.value, getBracketMarks()); }
function updateCaretState(){
  const v = code.value, s = code.selectionStart;
  const before = v.slice(0, s);
  const line = (before.match(/\n/g) || []).length + 1;
  const col = s - before.lastIndexOf('\n');
  statusPos.textContent = `Ln ${line}, Col ${col}`;
  const words = v.trim() ? v.trim().split(/\s+/).length : 0;
  statusCount.textContent = `${v.length} chars · ${words} words`;
}
let editorQueued = false;
function queueEditorUpdate(){
  if(editorQueued) return;
  editorQueued = true;
  requestAnimationFrame(() => { updateGutter(); renderHighlight(); updateCaretState(); editorQueued = false; });
}
function markErrorLine(n){
  errorLineNum = n;
  lastGutterKey = '';
  updateGutter();
  if(n){
    const lines = code.value.split('\n');
    if(n >= 1 && n <= lines.length){
      let start = 0;
      for(let i = 0; i < n - 1; i++) start += lines[i].length + 1;
      code.setSelectionRange(start, start + lines[n - 1].length);
      code.focus();
    }
  }
}
function findErrorLine(text){
  const patterns = [/line (\d+)/i, /:(\d+):\d+/, /\.\w+:(\d+)\b/, /\((\d+)\)/];
  for(const re of patterns){ const m = text.match(re); if(m) return parseInt(m[1], 10); }
  return null;
}

const COMMENT = {
  javascript:'//',typescript:'//',java:'//',c:'//','c++':'//',csharp:'//',go:'//',rust:'//',
  swift:'//',kotlin:'//',scala:'//',dart:'//',groovy:'//',php:'//',
  python:'#',ruby:'#',bash:'#',perl:'#',elixir:'#',julia:'#',rscript:'#',
  lua:'--',haskell:'--',sqlite3:'--',clojure:';'
};
function toggleComment(){
  const v = code.value, s = code.selectionStart, en = code.selectionEnd;
  if(langSelect.value === 'html'){
    const sel = v.slice(s, en);
    if(sel.trim().startsWith('<!--') && sel.trim().endsWith('-->')){
      insertTextRange(s, en, sel.trim().slice(4, -3).trim());
    } else {
      insertTextRange(s, en, `<!-- ${sel} -->`);
    }
    return;
  }
  const t = COMMENT[langSelect.value] || '//';
  const lineStart = v.lastIndexOf('\n', s - 1) + 1;
  let lineEnd = v.indexOf('\n', en); if(lineEnd === -1) lineEnd = v.length;
  const lines = v.slice(lineStart, lineEnd).split('\n');
  const esc = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const allCommented = lines.every(l => l.trim() === '' || new RegExp('^\\s*' + esc + ' ?').test(l));
  const newLines = lines.map(l => {
    if(l.trim() === '') return l;
    return allCommented ? l.replace(new RegExp('^(\\s*)' + esc + ' ?'), '$1') : l.replace(/^(\s*)/, `$1${t} `);
  });
  const newBlock = newLines.join('\n');
  insertTextRange(lineStart, lineEnd, newBlock);

}

// ---- 3. code formatter: re-indent by bracket depth, trim trailing whitespace ----
function formatCode(){
  const lang = langSelect.value;
  let lines = code.value.split('\n').map(l => l.replace(/[ \t]+$/,''));
  // collapse 3+ blank lines into 1
  lines = lines.filter((l,i) => !(l.trim()==='' && lines[i-1] !== undefined && lines[i-1].trim()==='' && lines[i-2] !== undefined && lines[i-2].trim()===''));
  if(lang !== 'python' && lang !== 'rscript' && lang !== 'sqlite3'){
    let depth = 0;
    const unit = '  ';
    lines = lines.map(line => {
      const trimmed = line.trim();
      if(trimmed === '') return '';
      const closesFirst = /^[)}\]]/.test(trimmed);
      let d = depth - (closesFirst ? 1 : 0);
      d = Math.max(0, d);
      const opens = (trimmed.match(/[{[(]/g)||[]).length;
      const closes = (trimmed.match(/[)}\]]/g)||[]).length;
      depth = Math.max(0, depth + opens - closes);
      return unit.repeat(d) + trimmed;
    });
  }
  const newVal = lines.join('\n');
  code.setSelectionRange(0, code.value.length);
  insertText(newVal);
  showToast('Formatted');
}
formatBtn.addEventListener('click', formatCode);

const SYMBOL_RE = /^\s*(?:export\s+)?(?:public\s+|private\s+|protected\s+|static\s+)*(?:async\s+)?(?:function\s+([A-Za-z_$][\w$]*)|class\s+([A-Za-z_$][\w$]*)|def\s+([A-Za-z_$][\w$]*)|fn\s+([A-Za-z_$][\w$]*)|func\s+([A-Za-z_$][\w$]*)|(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:\(|function))/;
function buildOutline(){
  const lines = code.value.split('\n');
  const items = [];
  lines.forEach((line, i) => {
    const m = line.match(SYMBOL_RE);
    if(m){
      const name = m.slice(1).find(Boolean);
      if(name) items.push({name, line: i + 1, preview: line.trim().slice(0, 40)});
    }
  });
  return items;
}
function openOutline(){
  findBarEl.hidden = true; gotoBar.hidden = true;
  const items = buildOutline();
  outlineList.innerHTML = '';
  if(!items.length){
    outlineList.innerHTML = '<div class="outline-empty">No functions or classes detected in this file.</div>';
  } else {
    items.forEach(it => {

      b.className = 'outline-item';
      b.textContent = `Ln ${it.line} · ${it.name}`;
      b.title = it.preview;
      b.addEventListener('click', () => {
        gotoInput.value = it.line;
        goToLine();
        outlineBar.hidden = true;

}

// ---- 7. Vim mode (subset: normal/insert, hjkl, w/b, 0/$, gg/G, x, dd, yy, p, u) ----
let vimEnabled = false, vimMode = 'insert', vimYank = '', vimPendingG = false, vimPending = null;
function setVimMode(m){
  vimMode = m;
  vimModeEl.textContent = m.toUpperCase();
}
vimBtn.addEventListener('click', () => {
  vimEnabled = !vimEnabled;
  vimBtn.classList.toggle('active', vimEnabled);
  vimModeEl.hidden = !vimEnabled;
  setVimMode(vimEnabled ? 'normal' : 'insert');
  showToast(vimEnabled ? 'Vim mode ON (subset: hjkl, w/b, 0/$, gg/G, x, dd, yy, p, u, i/a/o, Esc)' : 'Vim mode OFF');
});
function vimLineBounds(v, pos){
  const start = v.lastIndexOf('\n', pos - 1) + 1;
  let end = v.indexOf('\n', pos); if(end === -1) end = v.length;
  return [start, end];
}
function vimHandle(e){
  const v = code.value; let s = code.selectionStart;
  const move = (pos) => code.setSelectionRange(pos, pos);
  if(e.key === 'Escape'){ setVimMode('normal'); vimPending = null; e.preventDefault(); return true; }
  if(vimMode === 'insert') return false;
  e.preventDefault();
  if(vimPendingG){
    vimPendingG = false;
    if(e.key === 'g') move(0);
    queueEditorUpdate();
    return true;
  }
  if(vimPending === 'd' && e.key === 'd'){
    const [start,end] = vimLineBounds(v,s);
    code.setSelectionRange(start, Math.min(v.length, end+1));
    insertText('');
    vimPending = null;
    queueEditorUpdate();
    return true;
  }
  if(vimPending === 'y' && e.key === 'y'){
    const [start,end] = vimLineBounds(v,s);
    vimYank = v.slice(start,end) + '\n';
    vimPending = null;
    return true;
  }
  vimPending = null;
  switch(e.key){
    case 'i': setVimMode('insert'); break;
    case 'a': move(Math.min(v.length, s+1)); setVimMode('insert'); break;
    case 'o': { const [,end] = vimLineBounds(v,s); code.setSelectionRange(end,end); insertText('\n'); setVimMode('insert'); break; }
    case 'h': move(Math.max(0, s-1)); break;
    case 'l': move(Math.min(v.length, s+1)); break;
    case 'j': { const [,end] = vimLineBounds(v,s); move(Math.min(v.length, end+1)); break; }
    case 'k': { const [start] = vimLineBounds(v,s); move(Math.max(0, start-1)); break; }
    case '0': { const [start] = vimLineBounds(v,s); move(start); break; }
    case '$': { const [,end] = vimLineBounds(v,s); move(end); break; }
    case 'w': { const m = v.slice(s).match(/^\S*\s+/); move(m ? s+m[0].length : v.length); break; }
    case 'b': { const before = v.slice(0,s); const m = before.match(/\S+\s*$/); move(m ? s-m[0].length : 0); break; }
    case 'g': vimPendingG = true; break;
    case 'G': move(v.length); break;
    case 'x': { code.setSelectionRange(s, Math.min(v.length, s+1)); insertText(''); break; }
    case 'u': document.execCommand('undo'); queueEditorUpdate(); break;
    case 'd': vimPending = 'd'; break;
    case 'y': vimPending = 'y'; break;
    case 'p': if(vimYank){ const [,end] = vimLineBounds(v,s); code.setSelectionRange(end,end); insertText('\n'+vimYank.replace(/\n$/,'')); } break;
  }
  queueEditorUpdate();
  return true;
}

// ---- lightweight autocomplete: keywords + words already in the document ----
let acItems = [], acIndex = 0;
function collectWords(text){
  const set = new Set(KEYWORDS);

  let m;
  while((m = re.exec(text))) set.add(m[0]);
  return set;
}
function getCaretCoords(ta){
  const div = document.createElement('div');
  const cs = getComputedStyle(ta);
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','padding','border','boxSizing','tabSize'].forEach(p => div.style[p] = cs[p]);
  Object.assign(div.style, {position:'absolute',visibility:'hidden',whiteSpace:'pre-wrap',overflowWrap:'break-word',width:ta.clientWidth+'px',top:'0',left:'-9999px'});
  div.textContent = ta.value.slice(0, ta.selectionStart);
  const span = document.createElement('span');
  span.textContent = ta.value.slice(ta.selectionStart) || '.';
  div.appendChild(span);
  document.body.appendChild(div);
  const coords = {left: span.offsetLeft, top: span.offsetTop - ta.scrollTop, height: parseInt(cs.lineHeight) || 18};
  document.body.removeChild(div);
  return coords;
}
function hideAcMenu(){ acMenu.hidden = true; acItems = []; }
function renderAcMenu(items){

  items.forEach((w, i) => {
    const div = document.createElement('div');
    div.className = 'ac-item' + (i === 0 ? ' sel' : '');
    div.textContent = w;
    div.addEventListener('mousedown', e => e.preventDefault());
    div.addEventListener('click', () => acceptSuggestion(w));
    acMenu.appendChild(div);
  });
}
function moveAc(dir){
  acIndex = (acIndex + dir + acItems.length) % acItems.length;
  [...acMenu.children].forEach((el, i) => el.classList.toggle('sel', i === acIndex));
}
function acceptSuggestion(word){
  const s = code.selectionStart;
  const wm = code.value.slice(0, s).match(/[A-Za-z_$][\w$]*$/);
  const start = wm ? s - wm[0].length : s;
  code.setSelectionRange(start, s);
  insertText(word);
  hideAcMenu();
}
function updateAutocomplete(){
  if(code.selectionStart !== code.selectionEnd){ hideAcMenu(); return; }
  const wm = code.value.slice(0, code.selectionStart).match(/[A-Za-z_$][\w$]*$/);
  if(!wm || wm[0].length < 2){ hideAcMenu(); return; }
  const lower = wm[0].toLowerCase();
  const cands = [...collectWords(code.value)]
    .filter(w => w.toLowerCase().startsWith(lower) && w.toLowerCase() !== lower)
    .sort((a,b) => a.length - b.length).slice(0, 8);
  if(!cands.length){ hideAcMenu(); return; }
  acItems = cands; acIndex = 0;
  renderAcMenu(cands);
  const pos = getCaretCoords(code);
  acMenu.style.left = Math.max(0, Math.min(pos.left, code.clientWidth - 140)) + 'px';
  acMenu.style.top = (pos.top + pos.height) + 'px';
  acMenu.hidden = false;
}
code.addEventListener('blur', () => setTimeout(hideAcMenu, 150));

// ---- combined input handling: editor render + autosave + autocomplete ----
code.addEventListener('input', () => {
  errorLineNum = null;
  queueEditorUpdate();
  updateAutocomplete();
  queuePersist();
});

// ---- auto-indent, bracket pairing, and autocomplete keyboard nav ----
const PAIRS = {'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
const CLOSERS = new Set(Object.values(PAIRS));

// ---- 4. Emmet-style abbreviation expansion (HTML only, subset) ----
function parseEmmetNode(str){
  const m = str.match(/^([a-zA-Z][a-zA-Z0-9]*)?((?:[.#][\w-]+)*)(?:\*(\d+))?(?:\{([^}]*)\})?$/);
  if(!m) return null;
  const tag = m[1] || 'div';
  const classesIds = m[2] || '';
  const count = m[3] ? parseInt(m[3],10) : 1;
  const text = m[4] || '';
  const classes = []; let id = '';
  (classesIds.match(/[.#][\w-]+/g) || []).forEach(t => t[0] === '.' ? classes.push(t.slice(1)) : (id = t.slice(1)));
  let attrs = '';
  if(id) attrs += ` id="${id}"`;
  if(classes.length) attrs += ` class="${classes.join(' ')}"`;
  return {tag, attrs, count, text};
}
function expandEmmetChain(chain){
  const nodes = chain.map(parseEmmetNode).filter(Boolean);
  if(!nodes.length) return '';
  function build(i){
    if(i >= nodes.length) return '';
    const n = nodes[i];
    const inner = i+1 < nodes.length ? build(i+1) : (n.text || '');
    const single = `<${n.tag}${n.attrs}>${inner}</${n.tag}>`;
    return single.repeat(n.count);
  }
  return build(0);
}
function expandEmmet(abbr){
  return abbr.split('+').map(g => expandEmmetChain(g.split('>'))).join('');
}
function tryEmmetExpand(){
  const v = code.value, s = code.selectionStart;
  const m = v.slice(0, s).match(/[a-zA-Z0-9.#*+>{}$-]+$/);
  if(!m || !/[a-zA-Z]/.test(m[0])) return false;
  let expanded;
  try{ expanded = expandEmmet(m[0]); }catch(err){ return false; }
  if(!expanded) return false;
  insertTextRange(s - m[0].length, s, expanded);
  return true;
}

code.addEventListener('keydown', e => {
  if(vimEnabled && vimHandle(e)) return;
  if(!acMenu.hidden && acItems.length){
    if(e.key === 'ArrowDown'){ e.preventDefault(); moveAc(1); return; }
    if(e.key === 'ArrowUp'){ e.preventDefault(); moveAc(-1); return; }
    if(e.key === 'Tab' || e.key === 'Enter'){ e.preventDefault(); acceptSuggestion(acItems[acIndex]); return; }
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); hideAcMenu(); return; }
  }
  if((e.ctrlKey || e.metaKey) && e.key === '/'){ e.preventDefault(); toggleComment(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const s = code.selectionStart, en = code.selectionEnd, v = code.value;

  if(columnMode && s !== en && v.slice(s, en).includes('\n')){
    if(e.key === 'Backspace'){ e.preventDefault(); applyColumnEdit(null); return; }
    if(e.key.length === 1){ e.preventDefault(); applyColumnEdit(e.key); return; }
  }

  if(e.key === 'Enter'){
    e.preventDefault();
    const lineStart = v.lastIndexOf('\n', s - 1) + 1;
    const indent = (v.slice(lineStart, s).match(/^[ \t]*/) || [''])[0];
    const prevChar = v[s - 1], nextChar = v[s];
    let insert = '\n' + indent + (prevChar && '{[('.includes(prevChar) ? '  ' : '');
    if(prevChar && '{[('.includes(prevChar) && nextChar === PAIRS[prevChar]){
      insertText(insert + '\n' + indent);
      code.setSelectionRange(s + insert.length, s + insert.length);
    } else {
      insertText(insert);
    }
    return;
  }
  if(PAIRS[e.key] && s === en){
    e.preventDefault();
    insertText(e.key + PAIRS[e.key]);
    code.setSelectionRange(s + 1, s + 1);
    return;
  }
  if(CLOSERS.has(e.key) && v[s] === e.key && s === en){
    e.preventDefault();
    code.setSelectionRange(s + 1, s + 1);
    return;
  }
  if(e.key === 'Backspace' && s === en && PAIRS[v[s - 1]] === v[s]){
    e.preventDefault();
    code.setSelectionRange(s - 1, s + 1);
    insertText('');
    return;
  }
  if(e.key === 'Tab'){
    e.preventDefault();
    if(langSelect.value === 'html' && tryEmmetExpand()) return;
    insertText('  ');
  }
});

// ---- find & replace ----
const findBtn = document.getElementById('findBtn');
const findBarEl = document.getElementById('findBar');
const findInput = document.getElementById('findInput');
const replaceInput = document.getElementById('replaceInput');
const findCount = document.getElementById('findCount');
const findPrev = document.getElementById('findPrev');
const findNext = document.getElementById('findNext');
const replaceOne = document.getElementById('replaceOne');
const replaceAll = document.getElementById('replaceAll');
const findClose = document.getElementById('findClose');
let matches = [], matchIndex = -1;

function doSearch(){
  const q = findInput.value;
  matches = [];
  if(q){
    const v = code.value;
    if(useRegex){
      try{
        const re = new RegExp(q, 'g');
        let m;
        while((m = re.exec(v))){
          matches.push([m.index, m.index + (m[0].length || 1)]);
          if(m[0].length === 0) re.lastIndex++;
        }
      }catch(err){ /* invalid pattern: no matches */ }
    } else {
      let i = 0, idx;
      while((idx = v.indexOf(q, i)) !== -1){ matches.push([idx, idx + q.length]); i = idx + q.length; }
    }
  }
  matchIndex = matches.length ? 0 : -1;
  findCount.textContent = matches.length ? `${matchIndex + 1}/${matches.length}` : '0/0';
  if(matchIndex !== -1) selectMatch();
}
function selectMatch(){
  const [start, end] = matches[matchIndex];
  code.focus();
  code.setSelectionRange(start, end);
}
function step(dir){
  if(!matches.length) return;
  matchIndex = (matchIndex + dir + matches.length) % matches.length;
  findCount.textContent = `${matchIndex + 1}/${matches.length}`;
  selectMatch();
}
findInput.addEventListener('input', doSearch);
findNext.addEventListener('click', () => step(1));
findPrev.addEventListener('click', () => step(-1));
findInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); step(e.shiftKey ? -1 : 1); }
});
replaceOne.addEventListener('click', () => {
  if(matchIndex === -1) return;
  const [start, end] = matches[matchIndex];
  code.setSelectionRange(start, end);
  insertText(replaceInput.value);
  doSearch();
});
replaceAll.addEventListener('click', () => {
  const q = findInput.value;
  if(!q) return;
  let newVal;
  if(useRegex){
    try{ newVal = code.value.replace(new RegExp(q, 'g'), replaceInput.value); }
    catch(err){ showToast('Invalid regular expression'); return; }
  } else {
    newVal = code.value.split(q).join(replaceInput.value);
  }
  code.setSelectionRange(0, code.value.length);
  insertText(newVal);
  doSearch();
});
function openFind(){ gotoBar.hidden = true; outlineBar.hidden = true; findBarEl.hidden = false; findInput.focus(); findInput.select(); doSearch(); }
function closeFind(){ findBarEl.hidden = true; code.focus(); }
findBtn.addEventListener('click', openFind);
findClose.addEventListener('click', closeFind);
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){ e.preventDefault(); openFind(); }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'g'){ e.preventDefault(); openGoto(); }
  else if(e.key === 'Escape' && !findBarEl.hidden){ closeFind(); }
  else if(e.key === 'Escape' && !gotoBar.hidden){ closeGoto(); }
  else if(e.key === 'Escape' && !outlineBar.hidden){ outlineBar.hidden = true; code.focus(); }
  else if(e.key === 'Escape' && isFull){ fullscreenBtn.click(); }
});

// ---- theme handling (with auto light/dark) ----
const themeBtns = document.querySelectorAll('.themes button');
function safeMatchMedia(query){
  try{
    if(window.matchMedia) return window.matchMedia(query);
  }catch(err){}
  return { matches: false, addEventListener(){}, removeEventListener(){} };
}
const osDarkMQ = safeMatchMedia('(prefers-color-scheme: dark)');
function resolveAutoTheme(){ return osDarkMQ.matches ? 'dark' : 'light'; }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t === 'auto' ? resolveAutoTheme() : t);
}
function setTheme(t){
  localStorage.setItem('codeit-theme', t);
  applyTheme(t);
  themeBtns.forEach(b => b.classList.toggle('active', b.dataset.t === t));
}
themeBtns.forEach(b => b.addEventListener('click', () => setTheme(b.dataset.t)));
osDarkMQ.addEventListener('change', () => {
  if(localStorage.getItem('codeit-theme') === 'auto') applyTheme('auto');
});
setTheme(localStorage.getItem('codeit-theme') || 'dark');

// ---- 25 popular languages (Piston runtime ids) + friendly labels + file extensions ----
const POPULAR = [
  ['javascript','JavaScript','js'],['typescript','TypeScript','ts'],['python','Python','py'],
  ['java','Java','java'],['c','C','c'],['c++','C++','cpp'],['csharp','C#','cs'],['go','Go','go'],
  ['rust','Rust','rs'],['ruby','Ruby','rb'],['php','PHP','php'],['swift','Swift','swift'],
  ['kotlin','Kotlin','kt'],['scala','Scala','scala'],['perl','Perl','pl'],['lua','Lua','lua'],
  ['rscript','R','r'],['dart','Dart','dart'],['elixir','Elixir','ex'],['haskell','Haskell','hs'],
  ['clojure','Clojure','clj'],['bash','Bash','sh'],['sqlite3','SQL','sql'],['julia','Julia','jl'],
  ['groovy','Groovy','groovy']
];
const EXT = {html:'html'};
POPULAR.forEach(([v,,ext]) => EXT[v] = ext);

langSelect.innerHTML = '<option value="html">HTML (live preview)</option>' +
  POPULAR.map(([v,label]) => `<option value="${v}">${label}</option>`).join('');
langSelect.value = 'html';
langSelect.addEventListener('change', () => {
  showTab(langSelect.value === 'html' ? 'preview' : 'console');
  const f = files.find(x => x.id === activeId);
  if(f){ f.language = langSelect.value; persist(); }
});

async function loadRuntimes(){
  try{
    const res = await fetch(`${API}/runtimes`);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    data.forEach(r => { runtimes[r.language] = r.version; });
    const known = new Set(POPULAR.map(p => p[0]));
    const junk = new Set([
      'file','llvm_ir','nasm','nasm64','iverilog',
      'matl','befunge93','bqn','brachylog','brainfuck','cjam','cow','dragon',
      'emojicode','forte','golfscript','husk','japt','jelly','lolcode','osabie',
      'paradoc','pyth','retina','rockstar','samarium','vyxal','yeethon',
      'dash','emacs','pure','csharp.net','basic.net','fsharp.net','fsi'
    ]);
    const extra = Object.keys(runtimes).filter(l => !known.has(l) && !junk.has(l)).sort();
    langSelect.innerHTML += extra.map(l => `<option value="${l}">${l}</option>`).join('');
    setNetStatus(true);
  }catch(e){
    status.textContent = 'API unreachable';
    setOutput('Could not load the remote language list (' + e.message + ').\n"html" still runs fully offline in the Preview tab.');
    setNetStatus(false);
  }
}
loadRuntimes();

const BLANK_HTML = '<!DOCTYPE html>\n<html>\n<head>\n  <title>Untitled</title>\n</head>\n<body>\n\n</body>\n</html>';

// ---- multi-file tabs, auto-saved to localStorage ----
let files = [], activeId = null, fileCounter = 1, persistTimer = null;

function saveActiveFile(){
  const f = files.find(x => x.id === activeId);
  if(f){ f.content = code.value; f.language = langSelect.value; }
}
function loadActiveFile(){
  const f = files.find(x => x.id === activeId);
  if(!f) return;
  code.value = f.content;
  langSelect.value = f.language;
  errorLineNum = null; lastGutterKey = '';
  updateGutter();
  renderHighlight();
  updateCaretState();
  showTab(f.language === 'html' ? 'preview' : 'console');
  hideAcMenu();
}
function startRename(f, span){
  const input = document.createElement('input');
  input.className = 'tab-rename';
  input.value = f.name;
  span.replaceWith(input);
  input.focus();
  input.select();
  function commit(){
    const val = input.value.trim();
    f.name = val || f.name;
    persist();
    renderTabs();
  }
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ e.preventDefault(); renderTabs(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', e => e.stopPropagation());
}
function renderTabs(){
  tabBar.innerHTML = '';
  files.forEach(f => {
    const t = document.createElement('div');
    t.className = 'tab' + (f.id === activeId ? ' active' : '');
    const nameSpan = document.createElement('span');
    nameSpan.textContent = f.name;
    nameSpan.title = 'Double-tap to rename';
    nameSpan.addEventListener('click', () => switchFile(f.id));
    nameSpan.addEventListener('dblclick', e => { e.stopPropagation(); startRename(f, nameSpan); });
    const closeBtn = document.createElement('button');
    closeBtn.className = 'tab-close';
    closeBtn.textContent = '×';
    closeBtn.title = 'Close file';
    closeBtn.addEventListener('click', e => { e.stopPropagation(); closeFile(f.id); });
    t.append(nameSpan, closeBtn);
    tabBar.appendChild(t);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-add';
  addBtn.textContent = '+';
  addBtn.title = 'New file';
  addBtn.addEventListener('click', () => newFile());
  tabBar.appendChild(addBtn);
}
function persist(){
  saveActiveFile();
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try{ localStorage.setItem('codeit-files', JSON.stringify({files, activeId, fileCounter})); }catch(e){}
  }, 500);
}
function queuePersist(){ persist(); }
function switchFile(id){
  if(id === activeId) return;
  saveActiveFile();
  activeId = id;
  loadActiveFile();
  renderTabs();
  persist();
}
function newFile(name, language, content){
  if(activeId != null) saveActiveFile();
  language = language || langSelect.value || 'html';
  const f = { id: Date.now() + Math.random(), name: name || `untitled-${fileCounter++}.${EXT[language] || 'txt'}`, language, content: content || '' };
  files.push(f);
  activeId = f.id;
  loadActiveFile();
  renderTabs();
  persist();
}
function closeFile(id){
  const idx = files.findIndex(f => f.id === id);
  if(idx === -1) return;
  files.splice(idx, 1);
  if(!files.length){ newFile('untitled.html', 'html', ''); return; }
  if(activeId === id){
    activeId = files[Math.max(0, idx - 1)].id;
    loadActiveFile();
  }
  renderTabs();
  persist();
}
function loadPersisted(){
  try{
    const raw = localStorage.getItem('codeit-files');
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!Array.isArray(data.files) || !data.files.length) return false;
    files = data.files;
    fileCounter = data.fileCounter || files.length + 1;
    activeId = (data.activeId != null && files.some(f => f.id === data.activeId)) ? data.activeId : files[0].id;
    return true;
  }catch(e){ return false; }
}
if(loadPersisted()){
  loadActiveFile(); renderTabs();
  showToast(`Restored ${files.length} file${files.length > 1 ? 's' : ''} from your last session`);
} else {
  newFile('untitled.html', 'html', '');
}

// ---- import / export / copy ----
importBtn.addEventListener('click', () => importInput.click());
importInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const match = Object.entries(EXT).find(([,e2]) => e2 === ext);
    newFile(file.name, match ? match[0] : langSelect.value, reader.result);
  };
  reader.readAsText(file);
  importInput.value = '';
});
exportBtn.addEventListener('click', () => {
  saveActiveFile();
  const f = files.find(x => x.id === activeId);
  if(!f) return;
  const blob = new Blob([f.content], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = f.name || ('untitled.' + (EXT[f.language] || 'txt'));
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
copyBtn.addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(code.value); }
  catch(err){ code.select(); document.execCommand('copy'); }
  const old = copyBtn.textContent;
  copyBtn.textContent = '✓';
  setTimeout(() => copyBtn.textContent = old, 1000);
});
exportAllBtn.addEventListener('click', () => {
  saveActiveFile();
  const blob = new Blob([JSON.stringify({files, fileCounter}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'codeit-backup.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
importAllBtn.addEventListener('click', () => importAllInput.click());
importAllInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.files) || !data.files.length) throw new Error('No files found in backup');
      if(!confirm(`Restore ${data.files.length} file(s)? This replaces your currently open tabs.`)) return;
      files = data.files;
      fileCounter = data.fileCounter || files.length + 1;
      activeId = files[0].id;
      loadActiveFile();
      renderTabs();
      persist();
      showToast(`Restored ${files.length} file(s) from backup`);
    }catch(err){
      alert('Could not read that backup file: ' + err.message);
    }
  };
  reader.readAsText(file);
  importAllInput.value = '';
});

resetBtn.addEventListener('click', () => {
  code.value = '';
  errorLineNum = null; lastGutterKey = '';
  queueEditorUpdate();
  preview.srcdoc = '';
  setOutput('Press ▶ Run to execute your code.');
  status.textContent = 'idle';
  persist();
  code.focus();
});

blankBtn.addEventListener('click', () => {
  newFile('untitled.html', 'html', BLANK_HTML);
  preview.srcdoc = '';
  setOutput('Press ▶ Run to execute your code.');
  status.textContent = 'new file';
  showTab('preview');
  code.focus();
});

// ---- run code ----
runBtn.addEventListener('click', async () => {
  if(runBtn.disabled) return;
  const language = langSelect.value;
  errorLineNum = null; lastGutterKey = ''; updateGutter();

  if(language === 'html'){
    preview.srcdoc = code.value;
    showTab('preview');
    status.textContent = 'rendered';
    return;
  }

  const version = runtimes[language];
  if(!version){ setOutput('That language failed to load from the API. Try again or pick "html".'); showTab('console'); return; }

  showTab('console');
  runBtn.disabled = true;
  status.textContent = 'running…';
  setOutput('Contacting execution API…');

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try{
    const res = await fetch(`${API}/execute`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ language, version, files: [{ name: 'main', content: code.value }], stdin: stdinInput.value }),
      signal: controller.signal
    });
    if(!res.ok){ const text = await res.text(); throw new Error('HTTP ' + res.status + ' — ' + text.slice(0,200)); }
    const data = await res.json();
    const out = (data.run?.stdout || '') + (data.run?.stderr || '') || data.message || 'No output.';
    setOutput(out);
    status.textContent = data.run?.code === 0 ? 'success' : 'finished';
    setNetStatus(true);
    if(data.run?.stderr){
      const line = findErrorLine(data.run.stderr);
      if(line) markErrorLine(line);
    }
  }catch(err){
    const msg = err.name === 'AbortError' ? 'Request timed out after 15s.' : err.message;
    setOutput('Run failed: ' + msg + '\n\nThe execution API may be rate-limiting or blocking this network. "html" always works offline via Preview.');
    status.textContent = 'error';
    setNetStatus(false);
  }finally{
    clearTimeout(timeout);
    runBtn.disabled = false;
  }
});
